name: DataMagic Cards

on:
  push:
    branches: [main]
    paths:
      - "cards/**"
      - "skills/datamagic/**"
      - ".github/workflows/cards.yml"
  pull_request:
    paths:
      - "cards/**"
      - "skills/datamagic/**"
      - ".github/workflows/cards.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cards
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cards/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run workbench:typecheck
      - run: npm run workbench:build
