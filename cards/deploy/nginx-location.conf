# Include only inside the existing datamagic.chat HTTPS server block.
# Point current at a fully uploaded gallery release before reloading Nginx.
location = /cards {
    return 301 /cards/;
}

location ^~ /cards/media/ {
    alias /var/www/datamagic-cards/current/media/;
    autoindex off;
    sendfile on;
    expires 1h;
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /cards/fonts/ {
    alias /var/www/datamagic-cards/current/fonts/;
    autoindex off;
    sendfile on;
    expires 7d;
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /cards/ {
    alias /var/www/datamagic-cards/current/;
    index index.html;
    autoindex off;
    sendfile on;
    expires -1;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown;
    add_header X-Content-Type-Options nosniff always;
}
